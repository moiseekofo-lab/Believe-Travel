<!doctype html>
<html lang="fr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Espace client | Believe Travel</title>
<style>
  body{font:16px/1.5 system-ui,sans-serif;color:#142343;background:#f2f6ff;margin:0;padding:24px}
  main{max-width:34rem;margin:auto;background:white;padding:24px;border-radius:16px}
  label,input{display:block}
  input,button{font:inherit;padding:10px;border:1px solid #a5b2c9;border-radius:8px}
  input{box-sizing:border-box;width:100%;margin:5px 0 14px}
  button{background:#1760cc;color:white;cursor:pointer}
  button:disabled{opacity:.55}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
  main:has(#login:not([hidden])){max-width:30rem;padding:0;box-shadow:0 8px 28px #14234320}
  #login{position:relative;margin:0;border-radius:inherit;background:white url('/assets/connexion-client.webp') center/100% 100% no-repeat;aspect-ratio:672/950}
  main:has(#login:not([hidden])) #notice{margin:0;padding:12px 16px}
  main:has(#login:not([hidden])) #notice:empty{display:none}
  #login input,#login button{position:absolute;box-sizing:border-box;margin:0}
  #login input{left:14.7%;top:45.25%;width:70.5%;height:5.15%;min-height:24px;border:0;border-radius:999px;background:#e3e3e3;padding:0 12px}
  #login button{left:21%;top:87%;width:58%;height:5.5%;min-height:32px;border:0;background:transparent}
  #login :is(input,button):focus-visible{outline:2px solid #1760cc;outline-offset:2px}
  #login button:disabled{background:#e3e3e380;cursor:wait}
  @media(max-width:540px){
    body{padding:16px 12px}
    main{padding:12px}
  }
</style>
<main>
  <h1 class="sr-only">Espace client</h1>
  <form id="login">
    <label class="sr-only" for="key">Clé privée</label>
    <input id="key" type="password" required autocomplete="off">
    <button><span class="sr-only">Accéder à mon dossier</span></button>
  </form>
  <section id="account" hidden>
    <h2 id="name"></h2>
    <p id="service"></p>
    <p id="balance"></p>
    <p><progress id="progress" max="100" value="0" aria-label="Pourcentage payé"></progress> <span id="percent"></span></p>
    <ul id="history"></ul>
    <form id="payment">
      <label for="amount">Montant du versement en CDF</label>
      <input type="number" id="amount" min="1" step="1" required>
      <label for="phone">Numéro Mobile Money</label>
      <input type="tel" id="phone" autocomplete="tel" required>
      <button>Continuer vers Mobile Money</button>
    </form>
    <button id="refresh" type="button">Actualiser le solde</button>
    <button id="logout" type="button">Se déconnecter</button>
  </section>
  <p id="notice" role="status"></p>
</main>
<script type="module">
  const api = "https://believe-travel-payments.onrender.com/api/client";
  const q = id => document.getElementById(id);
  let key = sessionStorage.getItem("believeClientKey") || "";
  let balanceRequest;
  let submittingPayment = false;
  const money = value => Number(value).toLocaleString("fr-FR") + " CDF";

  async function request(path, options = {}) {
    const response = await fetch(api + path, {
      ...options, headers: { Authorization: "Bearer " + key, "Content-Type": "application/json" }
    });
    const data = await response.json();
    if (response.status === 401) {
      key = "";
      sessionStorage.removeItem("believeClientKey");
      q("account").hidden = true;
      q("login").hidden = false;
    }
    if (!response.ok) throw new Error(data.error || "Service indisponible.");
    return data;
  }

  function load() {
    if (!balanceRequest) balanceRequest = updateBalance().finally(() => { balanceRequest = null; });
    return balanceRequest;
  }

  async function updateBalance() {
    const data = await request("/account");
    sessionStorage.setItem("believeClientKey", key);
    q("key").value = "";
    q("login").hidden = true;
    q("account").hidden = false;
    q("name").textContent = data.name;
    q("service").textContent = data.service || "";
    q("balance").textContent = `Total ${money(data.total)} · Payé ${money(data.paid)} · Reste ${money(data.remaining)}`;
    const percent = data.percent ?? 100 * Number(data.paid) / Number(data.total);
    q("progress").value = percent;
    q("percent").textContent = percent.toLocaleString("fr-FR", { maximumFractionDigits: 2 }) + " % payé";
    const pending = data.installments.some(row => row.status === "PENDING");
    q("payment").hidden = pending || data.remaining === 0;
    q("amount").max = data.remaining;
    q("history").replaceChildren(...data.installments.map(row => {
      const item = document.createElement("li");
      const labels = { PENDING: "En attente", CONFIRMED: "Confirmé", FAILED: "Échoué" };
      item.textContent = new Date(row.created_at).toLocaleString("fr-FR") + " · " + money(row.amount)
        + " · " + labels[row.status] + (row.reference ? " · Réf. " + row.reference : "");
      if (row.resume_url) {
        const resume = document.createElement("a");
        resume.href = row.resume_url;
        resume.textContent = "Reprendre le paiement";
        item.append(" · ", resume);
      }
      return item;
    }));
    if (!submittingPayment) {
      q("notice").textContent = pending ? "Versement en attente de confirmation." : data.remaining === 0 ? "Payé intégralement" : "";
    }
  }

  async function run(button, action) {
    button.disabled = true;
    q("notice").textContent = "Chargement…";
    try { await action(); }
    catch (error) { q("notice").textContent = error.message; }
    finally { button.disabled = false; }
  }
  q("login").onsubmit = event => {
    event.preventDefault();
    key = q("key").value.trim();
    run(q("login").querySelector("button"), load);
  };
  q("refresh").onclick = () => run(q("refresh"), load);
  q("logout").onclick = () => {
    sessionStorage.removeItem("believeClientKey");
    location.reload();
  };
  q("payment").onsubmit = event => {
    event.preventDefault();
    run(q("payment").querySelector("button"), async () => {
      submittingPayment = true;
      try {
        const { redirectUrl } = await request("/installments", {
          method: "POST", body: JSON.stringify({ amount: q("amount").value, phone: q("phone").value })
        });
        location.assign(redirectUrl);
      } finally {
        submittingPayment = false;
      }
    });
  };
  function refreshVisibleBalance() {
    if (!key || q("account").hidden || document.hidden || submittingPayment) return;
    load().catch(error => {
      if (!key) q("notice").textContent = error.message;
    });
  }
  setInterval(refreshVisibleBalance, 15000);
  document.addEventListener("visibilitychange", refreshVisibleBalance);
  window.addEventListener("pageshow", event => {
    if (event.persisted) refreshVisibleBalance();
  });
  if (key) load().catch(error => { q("notice").textContent = error.message; });
</script>
</html>
