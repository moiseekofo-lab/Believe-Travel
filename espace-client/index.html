<!doctype html>
<html lang="fr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Espace client | Believe Travel</title>
<style>
  body{font:16px/1.5 system-ui,sans-serif;color:#142343;background:#f2f6ff;margin:0;padding:24px}
  main{max-width:34rem;margin:auto;background:white;padding:24px;border-radius:16px}
  label,input{display:block}
  input,button{font:inherit;padding:10px;border:1px solid #a5b2c9;border-radius:8px}
  input{box-sizing:border-box;width:100%;margin:5px 0 14px}
  button{background:#1760cc;color:white;cursor:pointer}
  button:disabled{opacity:.55}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
  main:has(#login:not([hidden])){max-width:30rem;padding:0;box-shadow:0 8px 28px #14234320}
  #login{position:relative;margin:0;border-radius:inherit;background:white url('/assets/connexion-client.webp') center/100% 100% no-repeat;aspect-ratio:672/950}
  main:has(#login:not([hidden])) #notice{margin:0;padding:12px 16px}
  main:has(#login:not([hidden])) #notice:empty{display:none}
  #login input,#login button{position:absolute;box-sizing:border-box;margin:0}
  #login input{left:14.7%;top:45.25%;width:70.5%;height:5.15%;min-height:24px;border:0;border-radius:999px;background:#e3e3e3;padding:0 12px}
  #login button{left:21%;top:87%;width:58%;height:5.5%;min-height:32px;border:0;background:transparent}
  #login :is(input,button):focus-visible{outline:2px solid #1760cc;outline-offset:2px}
  #login button:disabled{background:#e3e3e380;cursor:wait}
  [hidden]{display:none!important}
  .account-header,.progress-label{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .account-header img{width:54px;height:54px;object-fit:contain}
  .account-header>strong{border-left:1px solid #ccd6e8;padding-left:12px;font-size:clamp(.95rem,4vw,1.35rem)}
  .account-header strong,.amounts strong,#percent{color:#0757d6}
  .account-header details{margin-left:auto;position:relative}
  .account-header summary{display:grid;place-items:center;width:40px;height:40px;cursor:pointer;list-style:none}
  .account-header summary::-webkit-details-marker{display:none}
  .menu-bars{width:23px;height:3px;border-radius:2px;background:#142343;box-shadow:0 -7px #142343,0 7px #142343}
  .account-header button{position:absolute;right:0;top:100%;z-index:1;white-space:nowrap;box-shadow:0 6px 18px #14234330}
  .account-link{display:block;color:#142343;text-decoration:none;font-weight:700}
  a.payment-action{box-sizing:border-box;color:white;text-align:center;text-decoration:none}
  #account-back{display:inline-block;margin-top:12px;color:#0757d6}
  .account-card{margin:14px 0;padding:14px;border:1px solid #e3eaf5;border-radius:16px;box-shadow:0 3px 10px #14234308}
  .account-card h2,.account-card p{margin:0 0 6px}
  .account-card h2{font-size:1.05rem}
  .welcome{background:#f2f4f9;border-radius:999px;display:flex;align-items:center;gap:12px}.case-card{background:#e8f1ff}
  .welcome h2{margin:0}
  .avatar{display:grid;place-items:center;flex:0 0 36px;height:36px;border-radius:50%;background:#0757d6;color:white;font-weight:800}
  .amounts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:12px 0}
  .amounts div{background:#e8f1ff;border-radius:10px;padding:8px 4px;text-align:center;font-size:.78rem}
  .amounts div:nth-child(2){background:#e8f8d7}
  .amounts strong{display:block;font-size:clamp(.8rem,3vw,1.05rem);overflow-wrap:anywhere}
  #progress{width:100%;height:12px;display:block;margin:8px 0 2px;appearance:none;border:0;border-radius:999px;overflow:hidden;background:#dfe5ef}
  #progress::-webkit-progress-bar{background:#dfe5ef}
  #progress::-webkit-progress-value{background:#0757d6;border-radius:999px}
  #progress::-moz-progress-bar{background:#0757d6;border-radius:999px}
  #history{padding:0;list-style:none;margin:8px 0 0}
  #history li{margin-top:6px;padding:8px;background:#f2f4f9;border-radius:8px;overflow-wrap:anywhere}
  .history-row{display:flex;align-items:center;justify-content:space-between;gap:6px 10px;flex-wrap:wrap}
  .history-ref{display:block;color:#52617a;font-size:.75rem;margin-top:3px}
  .payment-status{border-radius:999px;padding:2px 8px;background:#fff1c4;color:#684600;font-size:.8rem}
  .payment-status.confirmed{background:#e1f5ce;color:#24580c}
  .payment-status.failed{background:#fae2e2;color:#872626}
  .payment-action{display:block;width:100%;padding:13px;border:0;border-radius:999px;background:#0757d6;font-weight:700}
  #payment{margin-top:12px}
  @media(max-width:540px){
    body{padding:16px 12px}
    main{padding:12px}
  }
</style>
<main>
  <h1 class="sr-only">Espace client</h1>
  <form id="login">
    <label class="sr-only" for="key">Clé privée</label>
    <input id="key" type="password" required autocomplete="off">
    <button><span class="sr-only">Accéder à mon dossier</span></button>
  </form>
  <section id="account" hidden>
    <header class="account-header">
      <img src="/assets/believe-travel-logo-cutout.png" alt="Believe Travel" width="54" height="54">
      <strong>Espace client RDC</strong>
      <details><summary aria-label="Menu"><span class="menu-bars" aria-hidden="true"></span></summary><button id="logout" type="button">Se déconnecter</button></details>
    </header>
    <a id="account-back" href="/espace-client/" hidden>Retour à mon espace</a>
    <div id="overview">
    <div class="account-card welcome"><span id="avatar" class="avatar" aria-hidden="true"></span><h2 id="name"></h2></div>
    <div class="account-card case-card"><h2>Mon dossier</h2><p id="service"></p></div>
    <div class="account-card">
      <h2>Paiement</h2>
      <div class="amounts">
        <div>Montant total<strong id="total"></strong></div>
        <div>Déjà versé<strong id="paid"></strong></div>
        <div>Reste à payer<strong id="remaining"></strong></div>
      </div>
      <div class="progress-label"><span>Progression du paiement</span><strong id="percent"></strong></div>
      <progress id="progress" max="100" value="0" aria-label="Pourcentage payé"></progress>
    </div>
    <a class="account-card account-link" href="?page=historique">Paiements enregistrés <span aria-hidden="true">›</span></a>
    <a id="open-payment" class="payment-action" href="?page=versement">Faire un versement</a>
    </div>
    <section id="history-page" class="account-card" hidden><h2>Paiements enregistrés</h2><p id="empty-history">Aucun versement enregistré.</p><ul id="history"></ul></section>
    <section id="payment-page" hidden>
    <h2>Faire un versement</h2>
    <p id="payment-remaining"></p>
    <form id="payment" class="account-card" hidden>
      <label for="amount">Montant du versement en CDF</label>
      <input type="number" id="amount" min="1" step="1" required>
      <label for="phone">Numéro Mobile Money</label>
      <input type="tel" id="phone" autocomplete="tel" required>
      <button>Continuer vers Mobile Money</button>
    </form>
    </section>
  </section>
  <p id="notice" role="status"></p>
</main>
<script type="module">
  const api = "https://believe-travel-payments.onrender.com/api/client";
  const q = id => document.getElementById(id);
  const page = new URLSearchParams(location.search).get("page");
  const historyPage = page === "historique";
  const paymentPage = page === "versement";
  q("overview").hidden = historyPage || paymentPage;
  q("account-back").hidden = !historyPage && !paymentPage;
  q("history-page").hidden = !historyPage;
  q("payment-page").hidden = !paymentPage;
  let key = sessionStorage.getItem("believeClientKey") || "";
  let balanceRequest;
  let submittingPayment = false;
  const money = value => Number(value).toLocaleString("fr-FR") + " CDF";

  async function request(path, options = {}) {
    const response = await fetch(api + path, {
      ...options, headers: { Authorization: "Bearer " + key, "Content-Type": "application/json" }
    });
    const data = await response.json();
    if (response.status === 401) {
      key = "";
      sessionStorage.removeItem("believeClientKey");
      q("account").hidden = true;
      q("login").hidden = false;
    }
    if (!response.ok) throw new Error(data.error || "Service indisponible.");
    return data;
  }

  function load() {
    if (!balanceRequest) balanceRequest = updateBalance().finally(() => { balanceRequest = null; });
    return balanceRequest;
  }

  async function updateBalance() {
    const data = await request("/account");
    sessionStorage.setItem("believeClientKey", key);
    q("key").value = "";
    q("login").hidden = true;
    q("account").hidden = false;
    q("name").textContent = "Bienvenue, " + data.name;
    q("avatar").textContent = data.name.trim().slice(0, 1).toLocaleUpperCase("fr");
    q("service").textContent = data.service || "";
    q("total").textContent = money(data.total);
    q("paid").textContent = money(data.paid);
    q("remaining").textContent = money(data.remaining);
    const percent = data.percent ?? 100 * Number(data.paid) / Number(data.total);
    q("progress").value = percent;
    q("percent").textContent = percent.toLocaleString("fr-FR", { maximumFractionDigits: 2 }) + " % payé";
    const pending = data.installments.some(row => row.status === "PENDING");
    const canPay = !pending && Number(data.remaining) > 0;
    q("open-payment").hidden = !canPay;
    q("payment").hidden = !paymentPage || !canPay;
    q("payment-remaining").textContent = "Reste à payer : " + money(data.remaining);
    q("amount").max = data.remaining;
    const pendingCutoff = Date.now() - 5 * 60 * 1000;
    const visibleInstallments = data.installments.filter(row =>
      row.status !== "PENDING" || Date.parse(row.created_at) > pendingCutoff
    );
    q("empty-history").hidden = visibleInstallments.length > 0;
    q("empty-history").textContent = pending && !visibleInstallments.length
      ? "Aucun versement confirmé."
      : "Aucun versement enregistré.";
    q("history").replaceChildren(...visibleInstallments.map(row => {
      const item = document.createElement("li");
      const labels = { PENDING: "En attente", CONFIRMED: "Confirmé", FAILED: "Échoué" };
      const line = document.createElement("div");
      line.className = "history-row";
      const date = document.createElement("span");
      date.textContent = new Date(row.created_at).toLocaleDateString("fr-FR", { day: "numeric", month: "short", year: "numeric" });
      const amount = document.createElement("strong");
      amount.textContent = money(row.amount);
      const badge = document.createElement("span");
      badge.className = "payment-status " + row.status.toLowerCase();
      badge.textContent = labels[row.status] || row.status;
      line.append(date, amount, badge);
      item.append(line);
      if (row.reference) {
        const reference = document.createElement("small");
        reference.className = "history-ref";
        reference.textContent = "Réf. " + row.reference;
        item.append(reference);
      }
      if (row.resume_url) {
        const resume = document.createElement("a");
        resume.href = row.resume_url;
        resume.textContent = "Reprendre le paiement";
        item.append(resume);
      }
      return item;
    }));
    const recentPending = visibleInstallments.some(row => row.status === "PENDING");
    if (!submittingPayment) {
      q("notice").textContent = recentPending ? "Versement en attente de confirmation." : "";
    }
  }

  async function run(button, action) {
    button.disabled = true;
    q("notice").textContent = "Chargement…";
    try { await action(); }
    catch (error) { q("notice").textContent = error.message; }
    finally { button.disabled = false; }
  }
  q("login").onsubmit = event => {
    event.preventDefault();
    key = q("key").value.trim();
    run(q("login").querySelector("button"), load);
  };
  q("logout").onclick = () => {
    sessionStorage.removeItem("believeClientKey");
    location.reload();
  };
  q("payment").onsubmit = event => {
    event.preventDefault();
    run(q("payment").querySelector("button"), async () => {
      submittingPayment = true;
      try {
        const { redirectUrl } = await request("/installments", {
          method: "POST", body: JSON.stringify({ amount: q("amount").value, phone: q("phone").value })
        });
        location.assign(redirectUrl);
      } finally {
        submittingPayment = false;
      }
    });
  };
  function refreshVisibleBalance() {
    if (!key || q("account").hidden || document.hidden || submittingPayment) return;
    load().catch(error => {
      if (!key) q("notice").textContent = error.message;
    });
  }
  setInterval(refreshVisibleBalance, 15000);
  document.addEventListener("visibilitychange", refreshVisibleBalance);
  window.addEventListener("pageshow", event => {
    if (event.persisted) refreshVisibleBalance();
  });
  if (key) load().catch(error => { q("notice").textContent = error.message; });
</script>
</html>
