<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Paiements | Believe Travel</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet"><style>
:root{--navy:#0b173e;--blue:#2174f5;--lime:#c9f019;--muted:#65718b;--line:#e4eaf4}*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#192342;font-family:Inter,system-ui,sans-serif}header{background:var(--navy);color:white;padding:22px}.wrap{width:min(1150px,calc(100% - 32px));margin:auto}.head{display:flex;justify-content:space-between;align-items:center;gap:20px}.brand{font-weight:800;font-size:20px}.brand small{display:block;color:#b9c8e8;font-size:11px;margin-top:3px}button,input{font:inherit}.login{display:flex;gap:8px}.login input{width:220px;padding:10px;border:0;border-radius:10px}.login button,.refresh{border:0;border-radius:10px;background:var(--lime);color:#263900;padding:10px 15px;font-weight:800;cursor:pointer}main{padding:30px 0}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:20px}.card{background:white;border:1px solid var(--line);border-radius:16px;padding:18px}.card span{color:var(--muted);font-size:12px}.card strong{display:block;margin-top:7px;color:var(--navy);font-size:24px}.panel{overflow:auto;background:white;border:1px solid var(--line);border-radius:16px}table{width:100%;border-collapse:collapse;min-width:850px}th,td{padding:13px;text-align:left;border-bottom:1px solid var(--line);font-size:12px}th{color:var(--muted);background:#fafbfe}.status{font-weight:800}.CONFIRMED{color:#087443}.FAILED{color:#b42318}.PROCESSING,.PENDING{color:#b66a00}.empty{padding:35px;text-align:center;color:var(--muted)}@media(max-width:700px){.head{align-items:flex-start;flex-direction:column}.login{width:100%}.login input{width:100%}.cards{grid-template-columns:1fr}}
</style></head><body><header><div class="wrap head"><div class="brand">Believe Travel<small>Administration des paiements PawaPay</small></div><div class="login"><input id="key" type="password" placeholder="Clé administrateur"><button id="connect">Connexion</button></div></div></header><main class="wrap"><div class="cards"><div class="card"><span>Paiements</span><strong id="count">—</strong></div><div class="card"><span>Confirmés</span><strong id="confirmed">—</strong></div><div class="card"><span>Total confirmé</span><strong id="total">—</strong></div></div><div class="panel"><table><thead><tr><th>Date</th><th>Client</th><th>Rendez-vous</th><th>Téléphone</th><th>Montant</th><th>Statut</th><th>Référence</th></tr></thead><tbody id="rows"><tr><td colspan="7" class="empty">Connectez-vous pour afficher l’historique.</td></tr></tbody></table></div></main><script>
const API='https://believe-travel-payments.onrender.com';const q=s=>document.querySelector(s);const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
async function load(){const key=q('#key').value||sessionStorage.getItem('believeAdminKey');if(!key)return;const response=await fetch(API+'/api/admin/payments',{headers:{Authorization:'Bearer '+key}});if(!response.ok){q('#rows').innerHTML='<tr><td colspan="7" class="empty">Clé invalide ou service indisponible.</td></tr>';return}sessionStorage.setItem('believeAdminKey',key);const {payments}=await response.json();q('#count').textContent=payments.length;q('#confirmed').textContent=payments.filter(p=>p.status==='CONFIRMED').length;q('#total').textContent=payments.filter(p=>p.status==='CONFIRMED').reduce((s,p)=>s+Number(p.amount),0).toLocaleString('fr-FR')+' CDF';q('#rows').innerHTML=payments.length?payments.map(p=>`<tr><td>${new Date(p.createdAt).toLocaleString('fr-FR')}</td><td>${esc(p.appointment?.nom)}</td><td>${esc(p.appointment?.date)} ${esc(p.appointment?.heure)}</td><td>${esc(p.phone)}</td><td>${Number(p.amount).toLocaleString('fr-FR')} ${esc(p.currency)}</td><td class="status ${esc(p.status)}">${esc(p.status)}</td><td>${esc(p.depositId)}</td></tr>`).join(''):'<tr><td colspan="7" class="empty">Aucun paiement.</td></tr>'}q('#connect').onclick=load;if(sessionStorage.getItem('believeAdminKey'))load();
</script></body></html>
