<!doctype html>
<html lang="fr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Clés clients | Believe Travel</title>
<style>
  body{font:16px/1.5 system-ui,sans-serif;margin:0;background:#f5f7fb;color:#142343}
  header{padding:20px clamp(16px,5vw,64px);background:#0b173e;color:white}
  header a{color:inherit}
  main{max-width:68rem;margin:auto;padding:24px 16px}
  #create,#result,#accounts>li{background:white;border:1px solid #e4eaf4;border-radius:14px;padding:clamp(14px,3vw,24px);margin-bottom:16px}
  label,input{display:block}
  input,button{font:inherit;padding:10px 12px;border-radius:8px}
  input{box-sizing:border-box;width:100%;border:1px solid #c7d2e4;margin:4px 0 14px}
  button{background:#1760cc;border:0;color:white;font-weight:700;cursor:pointer}
  button:disabled{opacity:.6;cursor:wait}
  #accounts{padding:0;list-style:none}
  li button{margin:4px 8px 4px 0}
  li{overflow-wrap:anywhere}
  .heading,.filters,.totals{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between}
  .heading h1{margin-bottom:0}.heading p{margin-top:4px}
  .table-wrap,#details{background:white;border:1px solid #e4eaf4;border-radius:14px;padding:14px;margin-bottom:16px}
  .scroll{overflow:auto}
  table{border-collapse:collapse;width:100%;text-align:left;white-space:nowrap}
  th,td{padding:12px;border-bottom:1px solid #e4eaf4}
  th{background:#f5f7fb}
  tr[aria-selected=true]{background:#e4efff}
  .filters input,.filters select{flex:1 1 180px;margin:0 0 12px}
  select{font:inherit;padding:10px;border:1px solid #c7d2e4;border-radius:8px;background:white}
  .badge{display:inline-block;padding:2px 9px;border-radius:20px;background:#fff0c3;color:#654500}
  .badge.paid{background:#dcf5e5;color:#075324}
  .badge.revoked{background:#f2e8e8;color:#7b2323}
  progress{display:block;width:100%;accent-color:#178b43}
  .totals span{flex:1;background:#ebf2ff;padding:10px;border-radius:8px}
  #details button,td button{margin:4px}
  .total-dialog{box-sizing:border-box;width:min(28rem,calc(100% - 32px));padding:24px;color:#142343;background:white;border:1px solid #e4eaf4;border-radius:16px;box-shadow:0 16px 48px #0b173e35}
  .total-dialog::backdrop{background:#0b173e80}
  .total-dialog h2{margin:0 0 16px}
  .total-editor .cancel{background:#e4eaf4;color:#142343}
</style>
<header><a href="/rendez-vous/admin/">Retour à l’administration</a></header>
<main>
<div class="heading">
  <div><h1>Gestion des clients</h1><p>Consultez les dossiers et suivez les paiements échelonnés.</p></div>
  <button id="new-client" type="button" aria-controls="create" aria-expanded="false" disabled>+ Nouveau client</button>
</div>
<form id="create" hidden>
  <label for="name">Nom complet du client</label>
  <input id="name" required maxlength="120">
  <label for="contact">Numéro de contact</label>
  <input id="contact" type="tel" required>
  <label for="service">Service</label>
  <input id="service" maxlength="160" required>
  <label for="total">Montant total des frais en CDF</label>
  <input id="total" type="number" min="1" max="999999999999" step="1" required>
  <button>Créer une clé</button>
</form>
<div id="result" hidden>
  <label for="client-key">Clé à transmettre en privé au client</label>
  <input id="client-key" readonly>
</div>
<p id="notice" role="status"></p>
<section id="dashboard" class="table-wrap" hidden aria-label="Liste des clients">
  <div class="filters">
    <input id="query" type="search" placeholder="Rechercher un client…" aria-label="Rechercher un client">
    <select id="service-filter" aria-label="Filtrer par service"><option value="">Tous les services</option></select>
    <select id="status-filter" aria-label="Filtrer par statut"><option value="">Tous les statuts</option><option>En cours</option><option>Payé</option><option>Clé révoquée</option></select>
  </div>
  <div class="scroll"><table>
    <thead><tr><th>#</th><th>Nom complet</th><th>Référence client</th><th>Service</th><th>Montant total</th><th>Payé</th><th>Reste</th><th>Statut</th><th>Actions</th></tr></thead>
    <tbody id="accounts"></tbody>
  </table></div>
  <p id="empty" hidden>Aucun client trouvé.</p>
</section>
<section id="details" hidden aria-label="Détail des paiements"></section>
</main>
<script type="module">
  const q = id => document.getElementById(id);
  const api = "https://believe-travel-payments.onrender.com/api/admin/clients";
  let accounts = [];
  let selectedId = null;
  const money = value => Number(value).toLocaleString("fr-FR") + " CDF";
  const status = account => account.revoked ? "Clé révoquée" : Number(account.paid) >= Number(account.total) ? "Payé" : "En cours";
  const button = (label, action) => {
    const node = document.createElement("button");
    node.type = "button";
    node.textContent = label;
    node.onclick = action;
    return node;
  };
  const textNode = (tag, value) => {
    const node = document.createElement(tag);
    node.textContent = value;
    return node;
  };
  async function request(body) {
    const key = sessionStorage.getItem("believeAdminKey");
    if (!key) throw new Error("Connectez-vous dans l’administration des paiements.");
    const response = await fetch(api, {
      method: body ? "POST" : "GET",
      headers: { Authorization: "Bearer " + key, "Content-Type": "application/json" },
      body: body ? JSON.stringify(body) : undefined
    });
    const data = await response.json().catch(() => ({}));
    if (response.status === 404) throw new Error("Le service de gestion des clients est momentanément indisponible.");
    if (!response.ok) throw new Error(data.error || "Service indisponible.");
    return data;
  }
  async function run(action) {
    q("notice").textContent = "Chargement…";
    try {
      await action();
      q("notice").textContent = "";
    } catch (error) {
      q("notice").textContent = error.message;
    }
  }
  async function load() {
    ({ accounts } = await request());
    const filter = q("service-filter");
    const service = filter.value;
    filter.replaceChildren(new Option("Tous les services", ""), ...[...new Set(accounts.map(account => account.service).filter(Boolean))].sort().map(value => new Option(value, value)));
    if ([...filter.options].some(option => option.value === service)) filter.value = service;
    q("new-client").disabled = false;
    q("dashboard").hidden = false;
    render();
  }
  function render() {
    const query = q("query").value.trim().toLocaleLowerCase("fr");
    const service = q("service-filter").value;
    const state = q("status-filter").value;
    const visible = accounts.filter(account =>
      (!service || account.service === service) && (!state || status(account) === state) &&
      [account.name, account.contact, account.service, account.id].some(value => String(value ?? "").toLocaleLowerCase("fr").includes(query))
    );
    const selected = visible.find(account => account.id === selectedId) || visible[0];
    selectedId = selected?.id ?? null;
    q("empty").hidden = visible.length > 0;
    q("accounts").replaceChildren(...visible.map((account, index) => {
      const row = document.createElement("tr");
      if (account.id === selectedId) row.setAttribute("aria-selected", "true");
      const paid = Number(account.paid ?? 0);
      row.append(...[index + 1, account.name, account.id.slice(0, 8).toUpperCase(), account.service || "—",
        money(account.total), money(paid), money(Number(account.total) - paid)].map(value => textNode("td", value)));
      const stateCell = document.createElement("td");
      const badge = textNode("span", status(account));
      badge.className = "badge " + (account.revoked ? "revoked" : status(account) === "Payé" ? "paid" : "");
      stateCell.append(badge);
      const actions = document.createElement("td");
      actions.append(button("Voir", () => {
        selectedId = account.id;
        render();
        q("details").focus();
      }));
      row.append(stateCell, actions);
      return row;
    }));
    q("details").hidden = !selected;
    q("details").replaceChildren();
    if (selected) renderDetails(selected);
  }
  function renderDetails(account) {
      const item = q("details");
      item.tabIndex = -1;
      const total = Number(account.total);
      const paid = Number(account.paid ?? 0);
      const percent = 100 * paid / total;
      item.append(textNode("h2", "Paiement · " + account.name), textNode("p", "Montant total : " + money(total)));
      if (account.contact) item.append(textNode("p", "Contact : " + account.contact));
      const progress = document.createElement("progress");
      progress.max = 100;
      progress.value = percent;
      progress.setAttribute("aria-label", "Part du total payée");
      const totals = document.createElement("div");
      totals.className = "totals";
      totals.append(textNode("span", "Montant payé : " + money(paid)), textNode("span", "Reste à payer : " + money(total - paid)));
      item.append(progress, textNode("p", percent.toLocaleString("fr-FR", { maximumFractionDigits: 2 }) + " % payé"), totals, textNode("h3", "Historique des paiements"));
      const history = document.createElement("div");
      history.className = "scroll";
      history.innerHTML = "<table><thead><tr><th>Date</th><th>Référence</th><th>Montant</th><th>Statut</th></tr></thead><tbody></tbody></table>";
      for (const entry of account.history ?? []) {
        const payment = document.createElement("tr");
        const labels = { CONFIRMED: "Confirmé", PENDING: "En attente", FAILED: "Échoué" };
        payment.append(...[new Date(entry.date).toLocaleString("fr-FR"), entry.reference, money(entry.amount), labels[entry.status] || entry.status].map(value => textNode("td", value)));
        history.querySelector("tbody").append(payment);
      }
      item.append(account.history?.length ? history : textNode("p", "Aucun versement enregistré."));
      const edit = document.createElement("button");
      edit.textContent = "Modifier le total";
      edit.type = "button";
      const dialog = document.createElement("dialog");
      dialog.className = "total-dialog";
      dialog.setAttribute("aria-labelledby", "total-dialog-title");
      dialog.append(textNode("h2", "Modifier le total"));
      dialog.firstElementChild.id = "total-dialog-title";
      const editor = document.createElement("form");
      editor.className = "total-editor";
      dialog.append(editor);
      editor.innerHTML = '<label for="edited-total">Nouveau montant total en CDF</label><input id="edited-total" type="number" min="1" max="999999999999" step="1" required><button>Enregistrer</button> <button type="button" class="cancel">Annuler</button><p role="status"></p>';
      const input = editor.querySelector("input");
      const save = editor.querySelector("button");
      const message = editor.querySelector("p");
      edit.onclick = () => {
        input.value = account.total;
        message.textContent = "";
        dialog.showModal();
        input.focus();
      };
      editor.querySelector(".cancel").onclick = () => {
        dialog.close();
      };
      editor.onsubmit = async event => {
        event.preventDefault();
        save.disabled = true;
        message.textContent = "Enregistrement…";
        try {
          await request({ accountId: account.id, action: "total", total: input.value });
          dialog.close();
          await load();
          q("notice").textContent = "Montant total mis à jour.";
          q("details").focus();
        } catch (error) {
          (dialog.open ? message : q("notice")).textContent = error.message;
        } finally {
          save.disabled = false;
        }
      };
      const adjust = document.createElement("button");
      adjust.textContent = "Valider un versement manuel";
      adjust.onclick = () => {
        const amount = prompt("Montant du versement manuel en CDF");
        if (amount === null) return;
        const reference = prompt("Référence du versement manuel");
        if (reference === null || !confirm(`Enregistrer ${amount} CDF pour ${account.name} ?`)) return;
        run(async () => {
          await request({ accountId: account.id, action: "adjust", amount: amount.trim(), reference });
          await load();
        });
      };
      item.append(edit, adjust, dialog);
      if (account.revoked) item.append(" · Clé révoquée");
      else {
        const button = document.createElement("button");
        button.textContent = "Révoquer la clé";
        button.onclick = () => {
          if (confirm("Révoquer la clé de ce client ?")) run(async () => {
            await request({ revoke: account.id });
            await load();
          });
        };
        item.append(button);
      }
  }
  q("new-client").onclick = () => {
    const form = q("create");
    form.hidden = !form.hidden;
    q("new-client").setAttribute("aria-expanded", String(!form.hidden));
    if (!form.hidden) q("name").focus();
  };
  q("query").oninput = render;
  q("service-filter").onchange = render;
  q("status-filter").onchange = render;
  q("create").onsubmit = async event => {
    event.preventDefault();
    const button = q("create").querySelector("button");
    button.disabled = true;
    await run(async () => {
      const { key } = await request({
        name: q("name").value, contact: q("contact").value,
        service: q("service").value, total: q("total").value
      });
      q("client-key").value = key;
      q("result").hidden = false;
      q("create").reset();
      await load();
    });
    button.disabled = false;
  };
  run(load);
</script>
</html>
